<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2ede2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yarın Defteri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Yarın Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Inter:wght@400;500;600&family=Jost:wght@400&display=swap">
<style>
/* Layout: one calm notebook page made of soft cards on ruled paper; a floating tab bar sits at the bottom. */
:root{
  --paper:#f2ede2;
  --desk:#e8e2d5;
  --sheet:#f8f4ea;
  --ink:#33373f;
  --ink-soft:#6b6f78;
  --ink-faint:#a9a8a1;
  --blue:#4a6d9f;--nt:var(--blue);
  --sun:#e08a4f;
  --today:#c9692a;--pj:#c9692a;--pj-soft:rgba(201,105,42,.34);--pj-wash:rgba(201,105,42,.12);--pin:#f7e792;--pin-ink:#4a431f;--pin-scroll:rgba(55,48,22,.55);
  --blue-soft:rgba(74,109,159,.28);
  --blue-wash:rgba(74,109,159,.11);
  --card:rgba(74,109,159,.055);
  --float:rgba(140,112,64,.075);
  --danger:#b4534a;
  --card-dim:rgba(60,76,110,.085);
  --chip:rgba(60,70,90,.07);
  --rule:rgba(60,72,100,.12);
  --rule-strong:rgba(60,72,100,.19);
  --scrim:rgba(36,34,30,.30);
  --shadow:0 12px 36px rgba(40,36,28,.16);
  --lift:0 1px 3px rgba(40,36,28,.14);
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .22 0 0 0 .035 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  --hand:'Caveat','Bradley Hand','Segoe Print','Comic Sans MS',cursive;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fs:1;--zm:1;--hs:calc(var(--fs)*var(--zm));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-mode]){
    --paper:#1b1c20;--desk:#131417;--sheet:#25262b;--ink:#e1ded5;--ink-soft:#a1a2a8;--ink-faint:#64656c;
    --sun:#f0a468;--today:#f0a468;--pj:#f0a468;--pj-soft:rgba(240,164,104,.36);--pj-wash:rgba(240,164,104,.15);--pin:#d8c76c;--pin-ink:#2e2911;--pin-scroll:#3b3d45;--blue:#8fabd6;--blue-soft:rgba(143,171,214,.32);--blue-wash:rgba(143,171,214,.15);
    --card:rgba(143,171,214,.07);--float:rgba(255,255,255,.04);--danger:#e0928a;--card-dim:rgba(143,171,214,.035);--chip:rgba(255,255,255,.07);
    --rule:rgba(255,255,255,.07);--rule-strong:rgba(255,255,255,.14);
    --scrim:rgba(0,0,0,.55);--shadow:0 12px 36px rgba(0,0,0,.5);--lift:0 1px 3px rgba(0,0,0,.4);
    --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .9 0 0 0 0 .9 0 0 0 .03 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode]),:root[data-mode="dark"]{
  --paper:#1b1c20;--desk:#131417;--sheet:#25262b;--ink:#e1ded5;--ink-soft:#a1a2a8;--ink-faint:#64656c;
  --sun:#f0a468;--today:#f0a468;--pj:#f0a468;--pj-soft:rgba(240,164,104,.36);--pj-wash:rgba(240,164,104,.15);--pin:#d8c76c;--pin-ink:#2e2911;--pin-scroll:#3b3d45;--blue:#8fabd6;--blue-soft:rgba(143,171,214,.32);--blue-wash:rgba(143,171,214,.15);
  --card:rgba(143,171,214,.07);--float:rgba(255,255,255,.04);--danger:#e0928a;--card-dim:rgba(143,171,214,.035);--chip:rgba(255,255,255,.07);
  --rule:rgba(255,255,255,.07);--rule-strong:rgba(255,255,255,.14);
  --scrim:rgba(0,0,0,.55);--shadow:0 12px 36px rgba(0,0,0,.5);--lift:0 1px 3px rgba(0,0,0,.4);
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .9 0 0 0 0 .9 0 0 0 .03 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  color-scheme:dark;
}
:root[data-font="plain"]{--hand:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fs:.66}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background-color:var(--paper);
  background-image:var(--grain);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 124px;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;transition:background-color .15s,color .15s,opacity .15s}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px}
h1{margin:0;font-weight:inherit}
.app{max-width:560px;margin:0 auto}

/* top bar */
.gear{pointer-events:auto;position:relative;flex:none;width:36px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-soft);background:none;border:0;box-shadow:none}

.gear[hidden]{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.dhead.pend::after{content:'';display:inline-block;width:7px;height:7px;margin-left:8px;border-radius:50%;background:var(--blue);vertical-align:middle}
.syncwarn{position:fixed;z-index:85;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);max-width:calc(100vw - 28px);padding:9px 15px;border-radius:999px;border:0;background:var(--chip);color:var(--ink);font:500 13px/1.25 var(--sans);box-shadow:0 4px 18px rgba(0,0,0,.28),0 0 0 1px var(--rule);text-align:center}
.syncwarn[hidden]{display:none}
.gear.pend::after{content:'';position:absolute;top:6px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--blue)}

.pinbtn svg .pn{fill:var(--pin);stroke:var(--ink-soft)}
.pinwrap.pdk{--pin:#3a3b41;--pin-ink:#ebe5cd;--pin-scroll:rgba(235,229,205,.3)}
.pinwrap.pdk .pthead{border-bottom-color:rgba(235,229,205,.2)}
.pinwrap.pdk .ppc,.pinwrap.pdk .pmove .mc,.pinwrap.pdk .pmove input[type=date]{background:rgba(235,229,205,.12)}
.pinwrap.pdk .pin .lnk{background:rgba(235,229,205,.1)}
.pinwrap.pdk .pdots button.on i{background:#ebe5cd}
.pinwrap{width:min(100%,380px);max-height:min(88vh,calc(var(--vvh,100vh) - 20px));display:flex;flex-direction:column;gap:10px;animation:rise .22s ease}
.pinbar{display:flex;align-items:center;gap:6px;min-width:0}
.pinbar .xbtn{width:34px;height:34px}
.pinpill{white-space:nowrap;background:var(--sheet);color:var(--ink);border-radius:999px;padding:10px 13px;font:600 13px/1 var(--sans);box-shadow:var(--lift)}
.pinbar .sp{flex:1}
.pstack{position:relative;flex:none;height:clamp(250px,calc(var(--vvh,100vh)*.5),400px);margin:4px 0 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pstack textarea{user-select:text;-webkit-user-select:text}
.pin{position:absolute;left:11%;top:6px;width:78%;height:calc(100% - 22px);box-sizing:border-box;display:flex;flex-direction:column;background:var(--pin);color:var(--pin-ink);border-radius:2px;padding:24px 14px 4px;box-shadow:0 14px 20px -10px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.12);transform-origin:50% 100%;transition:transform .3s cubic-bezier(.3,.7,.3,1),opacity .2s,filter .2s}
.pin:not(.front){cursor:pointer;filter:brightness(.95)}
.pin:not(.front)>*{pointer-events:none}
.pin:not(.front) textarea,.pin:not(.front) .pact,.pin:not(.front) .pthead{opacity:.4}
.ptitle{display:block;flex:none;width:100%;box-sizing:border-box;background:none;border:0;border-bottom:1px solid rgba(0,0,0,.14);outline:0;border-radius:0;padding:0 0 6px;margin:0 0 8px;font:600 calc(22px*var(--hs))/1.2 var(--hand);color:var(--pin-ink)}
.ptitle::placeholder{color:var(--pin-ink);opacity:.38;font-weight:400}
.pthead{display:flex;align-items:flex-start;gap:4px;flex:none;border-bottom:1px solid rgba(0,0,0,.14);margin:0 0 8px}
.pthead:focus-within{border-bottom-color:rgba(0,0,0,.35)}
.pthead .ptitle{display:block;flex:1 1 auto;width:auto;min-width:0;border:0;margin:0;padding:0 0 6px}
.pthead .pi{flex:none;display:grid;place-items:center;width:30px;height:28px;margin:-3px -6px 0 0;color:var(--pin-ink);opacity:.5}
.pthead .pi:hover,.pthead .pi:active{opacity:1}
.pthead .pi svg{display:block;width:17px;height:17px}
.pin.far{opacity:0;pointer-events:none}
.pin::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(rgba(0,0,0,.09),rgba(0,0,0,0))}
.pdots{position:relative;display:flex;justify-content:center;gap:2px;padding:0 0 2px;min-height:22px}
.pdots button{touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.ptip{position:absolute;bottom:30px;transform:translateX(-50%);z-index:60;max-width:240px;padding:7px 11px;border-radius:9px;background:var(--sheet);color:var(--ink);box-shadow:var(--lift);font:600 12.5px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.pstack.swp .pin{cursor:grabbing}
.ppick{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;background:var(--pin);box-shadow:0 -8px 14px -6px rgba(0,0,0,.25)}
.ppl{flex:1 1 100%;font:600 12px/1.2 var(--sans);color:var(--pin-ink);opacity:.75}
.ppc{padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.1);font:600 12.5px/1 var(--sans);color:var(--pin-ink)}
.ppc.x{padding:7px 9px}.ppc.x svg{width:12px;height:12px;display:block}
.xbtn.on{color:var(--blue)}
.ptrash{flex:1 1 auto;min-height:0;max-height:min(60vh,420px);overflow-y:auto;background:var(--sheet);border-radius:16px;padding:6px 14px 10px;box-shadow:var(--lift)}
.ptrhead{display:flex;align-items:center;gap:12px;padding:10px 0}
.ptrt{font:600 15px/1 var(--sans);color:var(--ink-soft)}
.ptrdng{padding:6px 11px;border-radius:999px;background:var(--chip);font:500 12.5px/1 var(--sans);color:var(--danger)}
.ptrempty{margin:6px 0 10px;font:14px/1.3 var(--sans);color:var(--ink-faint)}
.ptrrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.ptrtx{flex:1 1 auto;min-width:0}
.ptrti{font:600 14px/1.3 var(--sans);color:var(--ink);margin-bottom:2px}
.ptrbd{font:400 calc(18px*var(--hs))/1.25 var(--hand);color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.ptrbtn{flex:none;padding:8px 11px;border-radius:8px;background:var(--chip);font:600 12.5px/1 var(--sans);color:var(--ink-soft)}
.ptrbtn.ic{padding:8px}.ptrbtn.ic svg{width:16px;height:16px;display:block}
.pdots button{width:22px;height:22px;display:grid;place-items:center;padding:0}
.pdots button i{display:block;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.55}
.pdots button.on i{background:var(--pin);opacity:1;transform:scale(1.4)}
.pin textarea{display:block;flex:1 1 auto;width:100%;min-height:0;background:none;border:0;outline:0;resize:none;overflow-y:auto;padding:0;font:400 calc(24px*var(--hs))/1.28 var(--hand);color:var(--pin-ink)}
.view strong.fb,.nview strong.fb,.pview strong.fb,.ttview strong.fb{font-weight:700}
s.fs{text-decoration:line-through;text-decoration-thickness:.07em}
.selbar{--sbbg:#4d515b;--sbfg:#f6f3ea;position:fixed;z-index:2100;left:0;right:0;bottom:0;box-sizing:border-box;display:flex;align-items:center;justify-content:space-around;gap:2px;padding:3px 8px;background:var(--sbbg);color:var(--sbfg);border-top:1px solid color-mix(in srgb,var(--sbfg) 14%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-mode]) .selbar{--sbbg:#3d3f47;--sbfg:#e6e3da}}
:root[data-theme="dark"]:not([data-mode]) .selbar,:root[data-mode="dark"] .selbar{--sbbg:#3d3f47;--sbfg:#e6e3da}
.selbar button{flex:1 1 0;max-width:64px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--sbfg);touch-action:manipulation}
.selbar button svg{width:19px;height:19px;display:block}
.selbar button:hover,.selbar button:active{background:color-mix(in srgb,var(--sbfg) 18%,transparent)}
.selbar .sbin{flex:1 1 auto;min-width:0;height:36px;box-sizing:border-box;border:0;outline:0;background:color-mix(in srgb,var(--sbfg) 16%,transparent);color:var(--sbfg);border-radius:9px;padding:0 10px;font:500 14px/1 var(--sans)}
.selbar .sbin::placeholder{color:color-mix(in srgb,var(--sbfg) 55%,transparent)}
.selbar.sbfloat{left:auto;right:auto;bottom:auto;width:auto;justify-content:flex-start;padding:4px;border-radius:13px;border-top:0;box-shadow:0 8px 26px rgba(0,0,0,.34),0 0 0 1px color-mix(in srgb,var(--sbfg) 22%,transparent);transform-origin:var(--ox,50%) 0;animation:sbin .17s cubic-bezier(.2,.8,.3,1)}
.selbar.sbfloat button{flex:none;width:36px;max-width:none;height:34px}
.selbar.sbfloat button svg{width:17px;height:17px}
.selbar.sbfloat .sbin{flex:none;width:230px;height:34px}
.selbar.sbfloat .sbok{width:36px}
@keyframes sbin{from{opacity:0;transform:scale(.35,.7)}to{opacity:1;transform:none}}
.selbar .sbok{flex:none;width:44px;max-width:none;color:var(--sbfg);font:700 17px/1 var(--sans)}

mark.hl{background:var(--hl,rgba(255,214,10,.34));color:inherit;border-radius:4px;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root{--hl:rgba(255,205,40,.42)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:rgba(255,205,40,.30)}}
:root[data-theme="dark"]{--hl:rgba(255,205,40,.30)}
.pin mark.hl{background:rgba(255,92,120,.28)}
.pinwrap.pdk .pin mark.hl{background:rgba(255,205,40,.30)}
.pin .pview{display:block;flex:1 1 auto;min-height:0;overflow-y:auto;font:400 calc(24px*var(--hs))/1.28 var(--hand);color:var(--pin-ink);white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.pin .pview .ilk{color:var(--blue);font-weight:700;text-decoration:none}
.pin.pvon .lnks{display:none}
.pin .lkform{padding:6px 0 2px;flex:none}
.pin .lkin{flex:1 1 auto;min-width:0;font:15px var(--sans);color:var(--pin-ink);background:rgba(255,255,255,.45);border:0;border-radius:7px;padding:8px}
.pin .lkok,.pin .lkno{font:600 13px/1 var(--sans);color:var(--pin-ink);padding:8px 6px;opacity:.8}
.pinwrap.pdk .pin .lkin{background:rgba(235,229,205,.12)}
.pinwrap.pdk .pin .pview .ilk{color:var(--pin-ink)}
.pin textarea::placeholder{color:var(--pin-ink);opacity:.45}
.pin .pact{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.pin .pact .pi{display:inline-flex;align-items:center;gap:3px;padding:8px 7px;opacity:.78}
.pin .pact .pi svg{display:block;width:19px;height:19px}
.pin .pact .pi svg:first-child:not(:only-child){width:12px;height:12px}
.pin .pact button{font:600 12px/1 var(--sans);color:var(--pin-ink);opacity:.62;padding:10px 6px}
.pin .pact button:hover,.pin .pact button.on{opacity:1}
.pmove{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px;padding:8px;border-radius:8px;background:rgba(0,0,0,.07)}
.ptasks{background:var(--sheet);border-radius:12px;padding:2px 10px 2px 4px}
.pin .ptasks{margin:0 0 10px;transform:rotate(.8deg)}
.ptasks.ptop{flex:1 1 100%;border-radius:16px;box-shadow:var(--lift);padding:4px 12px 4px 6px}
.ptop.dover{outline:2px dashed var(--blue);outline-offset:2px}
.ptasks .phint{padding:12px 8px;font:13px/1.3 var(--sans);color:var(--ink-soft)}
.ptasks .arow:last-child{border-bottom:0}
.ptasks .arow{padding:8px 0;gap:6px}
.ptasks .at{font:600 14px/1.3 var(--sans)}
.trow .grip{flex:none;width:22px;height:34px;display:grid;place-items:center;color:var(--ink-faint);touch-action:none;cursor:grab}
.trow.tdrag{opacity:.35}
.trow.tb{box-shadow:0 -2px 0 var(--blue)}
.trow.ta{box-shadow:0 2px 0 var(--blue)}
.pin.dover{outline:2px dashed var(--blue);outline-offset:2px}
.pmove .pmsg{flex:1 1 100%;font:600 12px/1.3 var(--sans);color:var(--pin-ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmove .ml{font:600 12px/1 var(--sans)}
.pmove input[type=date]{flex:1 1 90px;min-width:0;font:14px var(--sans);color:var(--pin-ink);background:rgba(255,255,255,.45);border:0;border-radius:7px;padding:7px 8px}
.pmove .mc{flex:1 1 auto;padding:8px 10px;border-radius:7px;background:rgba(255,255,255,.45);font:600 12px/1 var(--sans);color:var(--pin-ink);text-align:center}

/* period navigation */
.nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:0;margin:0 0 20px}
.ncenter{display:flex;align-items:flex-start;justify-content:center;min-width:0}
.ncenter .t{flex:1 1 auto;max-width:calc(300px*var(--hs))}
.nslot.r{display:flex;justify-content:flex-end;width:36px;min-width:36px}
.nslot.l{display:flex;justify-content:flex-start;width:36px;min-width:36px}
.pinbtn{width:36px;margin-left:-1.5px}
.nbp{display:flex;flex-direction:column}
.nbrow{display:flex;align-items:center;gap:6px;margin:0 -2px;padding-bottom:12px}
.nbtabs{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:8px 6px;padding:2px}
.nbsep{flex:none;align-self:center;width:1.5px;height:20px;margin:0 -2px;border-radius:1px;background:var(--rule-strong)}
.nbt.defc{display:inline-flex;align-items:center;gap:6px;padding:7px 12px}.nbt.defc svg{display:block}.nbt.defc b{font:600 12.5px/1 var(--sans)}
.nbt.defc{background:none;box-shadow:inset 0 0 0 1.5px var(--rule-strong)}
.nbt.defc[aria-pressed="true"]{background:var(--blue-wash);box-shadow:inset 0 0 0 1.5px var(--blue-soft)}
.nbt{flex:none;padding:8px 14px;border-radius:999px;background:var(--chip);font:500 13.5px/1 var(--sans);color:var(--ink-soft);white-space:nowrap}
.nbt[aria-pressed="true"]{background:var(--blue-wash);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue-soft)}
.nbt.plus{padding:8px 14px;font-size:17px;line-height:1}
.nbt.del{color:var(--danger)}
.nbt.over{background:var(--blue-soft);color:var(--blue)}

/* month sections on 6-month and year pages */
.msec{margin:0 0 8px;padding:2px 14px 8px;background:var(--card);border-radius:18px}

@keyframes slR{from{opacity:.2;transform:translateX(38px)}to{opacity:1;transform:translateX(0)}}

/* floating tab bar */

  position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;

}

/* slim scrollbar everywhere (sheets, notes, textareas), clear of the rounded corners */
*::-webkit-scrollbar{width:12px;height:12px}

.backdrop.center .panel{max-width:440px;max-height:80%;border-radius:24px;padding-bottom:14px}

/* settings: every row shares one left and one right edge (the logo's and the close button's) */
.panel.sett .srow,.panel.sett .srow2,.panel.sett .btnrow{padding-left:0;padding-right:0}
.panel.sett .dhead,.panel.sett .slabel{padding-left:0;padding-right:0}

    aboutIntro:'Yarın Defteri, zamanı ve günleri daha iyi algılamak ve yönetebilmek için ortaya çıktı. Dağınık dikkat deneyimi olanlar bilir, gözünün önünde olmayan şey yok gibidir.\nBu yüzden Yarın Defteri\u2019nde bir girdiyi hem bir gün içinden, hem hafta, hem ay, hem de yıl ya da yıllar içinden görebilirsiniz. Böylece unutmazsınız. Ve kolayca erteleyebileceğiniz için stres de yaratmaz.\nGün, hafta, ay, yıl ve 10 yıl, aynı işe farklı ölçeklerden bakmanızı sağlayan birbirine bağlı görünümlerdir; böylece bugünü daha geniş bir zaman bağlamında görürsünüz. Her işin bir güne sığması gerekmez; ne zaman yapacağını bilmediğiniz görevleri uygun zaman aralığına (\u201cbu hafta\u201d, \u201cbu ay\u201d, \u201cbu yıl\u201d) bırakıp vakti gelince bir güne taşıyabilirsiniz. Böylece işleri tek güne sıkıştırmak yerine zamana yayar, yetişemediklerinizi ertelersiniz.\nSürükleme bu işin kalbidir: görevi tutup farklı bir zamana ya da alttaki bir görünüme bırakarak ilgili tarihe taşıyabilir ya da defter ikonuna bırakıp arşivleyebilirsiniz. Benzer şekilde, Zamansız Notlar\u2019daki notları da sürükleyerek sekmelere veya çöpe taşıyabilirsiniz.\nBir zamanı olmayan notlar için post-it ve Zamansız Notlar var; fikirler, hatırlanacaklar ve kenara koyduğunuzuz işler orada bekler.',
    howTitle:'Nasıl kullanılır',backExit:'Çıkmak için bir kez daha geri basın',advTitle:'Beta',selbarOn:'Biçim çubuğu: açık',selbarOff:'Biçim çubuğu: kapalı',liteGo:'Rafine moda geçin',liteOff:'Normal moda dönün',
    helpIntro:'Yarın Defteri, kâğıt defterin boş bıraktığı yerleri tamamlamak için yapıldı: yazın, işaretleyin, yetişmeyeni yarına bırakın. Gün, hafta, ay, yıl ve 10 yıl sayfaları birbirine bağlıdır; hepsinde hem liste hem takvim gibi planlayabilirsiniz. Tarihi belli olmayan işi \u201cbu hafta\u201d ya da \u201cbu ay içinde\u201d diye yazarsınız; kâğıt parçası gibi kullan-at notlar için post-it, kalıcı fikirler için Zamansız Notlar var.',
    helpTabs:['Yarın Defteri','Post-it','Zamansız Notlar'],
    helpPin:[
      ['Post-it nedir','Üstteki post-it düğmesi hiçbir güne bağlı olmayan, kullan-at bir alandır: telefon numarası, alışveriş listesi, aklınıza gelen bir cümle. Yazdığınız anda kaydedilir. En fazla 10 post-it tutarsınız.'],
      ['Başlık ve yazı','Her post-itin üstünde küçük bir <b>Başlık</b> alanı vardır, isterseniz doldurursunuz. Altına yazdıklarınız notun kendisidir; <b>☐</b> ile onay kutulu satırlar ekleyebilirsiniz. <b>+ Yeni</b> yeni bir post-it açar. Çöp ikonu başlığın sağındadır. Üstteki <b>ay ikonu</b> post-iti koyu yapar (gece parlamasın diye); uygulama koyu temadayken post-it zaten koyu açılır, <b>güneş ikonu</b> sarıya döndürür.'],
      ['Post-itler arasında gezmek','Post-itler üst üste durur. Parmağınızla sağa ya da sola kaydırarak, kenardaki yanına dokunarak ya da alttaki noktalara basarak diğerine geçersiniz. Bir noktaya <b>uzun basarsanız</b> o post-itin başlığı görünür; pasif noktalar soluktur.'],
      ['Güne ya da Zamansız Notlara taşıyın','Alttaki ikonlar post-iti başka yere taşır. <b>Okla güneşli sayfa ikonu</b> post-iti bütünüyle bugünün sayfasına gönderir: başlık görevin kendisi olur, altına yazdıklarınız görevin notuna, ☐ ile işaretli satırlar ise notun madde listesine geçer. Başlık boşsa ilk satır görev olur. <b>Okla defter ikonu</b> post-iti Zamansız Notlar’a gönderir; birden fazla sekmeniz varsa hangisine gideceğini seçersiniz.'],
      ['Çöp','Çöp ikonu post-iti siler, ama hemen kaybolmaz: üstteki çöp ikonuyla <b>Çöp</b> görünümünü açarsınız. Oradan <b>Geri koyun</b> düğmesiyle post-iti geri getirir, satırdaki çöp ikonuyla tamamen kaldırır, <b>Çöpü boşaltın</b> düğmesiyle hepsini silersiniz (emin olmak için iki kere dokunursunuz).']
    ],
    helpNb:[
      ['Zamansız Notlar nedir','Alttaki çubukta sağdaki defter ikonu Zamansız Notlar’ı açar. Burası bir görev alanı değil, bir hatırlama alanıdır: günlük gibi, fikir ve not defteri gibi. Hiçbir güne bağlı değildir, sayılmaz, bitmesi gerekmez.'],
      ['Not yazmak','Üstteki kutuya yazın, <b>Enter</b> ile kaydedersiniz (yeni satır için Shift+Enter). Yazıp kaydetmediyseniz başka bir yere dokunsanız bile yazınız kutuda durur; siz kaydedene ya da silene kadar kaybolmaz.'],
      ['Sekmeler','<b>Katmanlı ikon</b> tüm sekmelerdeki notları bir arada gösterir; <b>Diğer</b> henüz bir sekmeye koymadığınız notları. Saat ikonlu <b>Arşiv</b> kenara koyduğunuzuz görevlerin yeridir. <b>+</b> ile kendi sekmelerinizi açarsınız (en fazla 12); bir sekme seçiliyken notların altında küçük ikonlar görünür: <b>kalem</b> adı değiştirir, <b>çöp</b> sekmeyi siler; sekmeye uzun basıp sürükleyerek sırasını değiştirirsiniz. Sekme silinince notlar Diğer’e döner.'],
      ['Şifreli sekme','Bir sekmeyi seçince notların altında <b>kilit ikonu</b> görünür; ona dokunup şifre koyarsınız. Şifrelediğiniz sekmeyi günlük gibi kullanabilirsiniz: kilitliyken yalnızca kilit görünür, notların başlığı da sayısı da gizlidir, <b>Tüm notlar</b>’da çıkmaz. Açıkken 5 dakika dokunmazsanız kendiliğinden kilitlenir; kilit ikonuyla siz de kilitleyebilirsiniz, anahtar ikonu şifreyi değiştirir, açık kilit şifreyi kaldırır. Notlar senkronda ve yedekte de şifreli taşınır. Şifre kısaysa tahmin edilebilir, uzun bir şifre daha güvenlidir. Unutursanız notlar geri getirilemez; kurtarma kodu yoktur.'],
      ['Uzun notlar','Notun altındaki üçgen uzun yazıyı 4 satıra kısaltır ya da açar: <b>içi boş üçgen</b> kapalı, <b>dolu üçgen</b> açık demektir. 10 satırdan uzun notlar kapalı gelir.'],
      ['Üç nokta, tarih ve taşımak','Notun sekmesi ve yazıldığı tarih varsayılan olarak gizlidir; üç noktalı tutamağa <b>dokununca</b> o notun altında görünür. Tutamaçtan <b>sürükleyerek</b> notu üstteki sekmelerden birine bırakırsınız, taşınmış olur. Sürüklerken tutamacı çöp ikonuna bırakırsanız not çöpe gider.'],
      ['Çöp','Yeni not kutusunun sağındaki çöp ikonuna dokununca silinen notlar açılır. Bir notu sekmeye sürükleyerek geri koyarsınız, notun yanındaki çöp ikonuyla kalıcı silersiniz, <b>Çöpü boşaltın</b> düğmesi hepsini siler. Çöpte sayaç yoktur; burası serbest alan.'],
      ['Arşiv: kenara konan görevler','Bir görevi sayfadan tutup alttaki defter simgesine bırakırsanız ya da satır menüsündeki <b>saat ikonuna</b> basarsanız <b>Arşiv</b> sekmesine gider; alt maddeleri ve notuyla birlikte bekler. Arşivdeki bir satırın yazısına ya da not ikonuna dokunarak notunu açar, düzenlersiniz; kilitli değildir. Aynı liste Ayarlar\u2019daki <b>Arşiv</b> düğmesinde de açılır. Sayaç yoktur. İstediğinizde <b>Geri koyun</b> düğmesiyle bugüne ya da başka bir sayfaya döndürürsünüz.']
    ],

    help:[
      ['Yazmak ve işaretlemek','Bir satıra dokunup yazın, <b>Enter</b> yeni satır açar. Kutucuk satırın üstünü çizer, hiçbir şey silinmez. Notlardaki web adresleri tıklanabilir olur.'],
      ['Satır içi kutucuklar','Satırın içine <b>[ ]</b> yazın: “[ ] süt [ ] ekmek”. Her kutucuk kendi yazısıyla bir parçadır, dokununca işaretlenir. Kutucuğa <b>basılı tutup</b> (bilgisayarda tıklayıp sürükleyerek) parçayı aynı satırda başka bir yere, başka bir satıra, “Bu hafta içinde” gibi bir listeye ya da boş bir satıra taşırsınız; mavi çizgi nereye gireceğini gösterir.'],
      ['Sayfalar','Gün, hafta, ay, yıl ve 10 yıl sayfaları birbirine bağlıdır; alttaki çubuktan seçer, kaydırarak ilerlersiniz. Her sayfada <b>Bu hafta içinde</b>, <b>Bu ay içinde</b> gibi alanlar vardır: o döneme ait ama bir güne atanmamış işler buraya yazılır.'],

      ['Hafta sayfası','Yedi gün alt alta kart olarak durur; kartın başlığına dokunmak o günü açar. En üstteki <b>Bu hafta içinde</b> alanı haftaya ait ama güne atanmamış işlerindir, geçen haftadan kalanlar <b>buraya alın</b> ile gelir.'],
      ['Ay sayfası','Takvimde her günün işleri başlık olarak görünür (biten soluk ve üstü çizili, fazlası <b>+2</b> gibi). Bir güne dokununca altta <b>Bu ay</b> bölümünde açılır; ikinci dokunuş ya da <b>Güne gidin</b> gün sayfasını açar. <b>Genişletin</b> bütün günleri alt alta gösterir. <b>Bu ay içinde</b> işlerini ya da takvimdeki başlıkları tutup başka bir güne bırakırsınız.'],
      ['Yıl ve 10 yıl','Uzun ve çok uzun vadeli planlar içindir.'],
      ['Taşımak ve ertelemek','Kutucuğa basılı tutun (bilgisayarda sürükleyin) ve başka bir güne, haftaya, aya ya da yıla bırakın. Alttaki görünümlere bırakırsanız görev o görünüme (gün, hafta, ay, yıl, 10 yıl) gider; gün sayfasında üstteki <b>‹ ›</b> oklarına bırakırsanız önceki ya da sonraki güne gider; alttaki <b>defter ikonuna</b> bırakırsanız Arşiv\u2019e kalkar. Ya da satırı açıp <b>üç nokta</b> menüsünden <b>Yarına</b>, <b>Haftaya</b>, <b>Aya</b> deyin, tarih seçin ya da tekrar kurun.'],
      ['Not sayfası','Satırın sağındaki ikon not sayfasını açar: başlık, madde listesi ve serbest bir not alanı. Maddeleri basılı tutup sürükleyerek sıralar, takvim ikonuyla tarih verirsiniz; tarihli madde o günün sayfasına da düşer. İlerleme (örneğin 2/5) başlığın yanında görünür. Biten maddeyi <b>Arşivlemek için buraya bırakın</b> alanına sürüklerseniz <b>Arşiv</b> bölümüne gider, ilerlemede sayılmaya devam eder. Not eklenen satırlarda üç nokta yerine not simgesi görünür.'],
      ['Hava durumu','Tarihin yanındaki küçük bulut ikonuna dokunun ve bir kez şehrinizi seçin (ya da konumunuzu kullanın). Günün sıcaklığı tarihin yanında görünür; dokununca o günün özeti açılır: saat saat yağmur, kar ya da fırtına aralıkları, en yüksek, en düşük ve hissedilen sıcaklık, yağış, rüzgâr, UV, gün doğumu ve batımı. <b>10 günlük tahmin</b> yeni bir sayfa açar, geri okuyla özete dönersiniz; yenile düğmesi tahmini günceller. Hafta sayfasında günlerin altında da görünür. Ayarlar’daki <b>Hava durumu</b> bölümünden kapatır ya da şehri değiştirirsiniz. Veri Open-Meteo’dan gelir; yalnızca şehrin koordinatı gönderilir, notlarınız hiçbir yere gitmez.'],
      ['Ayarlar','Ayarlar\u2019dan dili (TR ya da EN), açık ya da koyu temayı, yazı tipini ve boyutunu seçersiniz. <b>Yedek</b> defterinizi dosya olarak kaydeder, kopyalar ya da geri yükler; ayrıca bu cihazdaki veri üzerine yazılmadan önce otomatik saklanan son 4 kopya da burada durur, tek dokunuşla geri yüklersiniz. <b>Arşiv</b> arşivlediğiniz ve sildiğiniz satırları geri koyar (silinenler 30 gün durur); Göz ikonu (tema ve tam ekran düğmelerinin yanında) üstü çizili satırları saklar. <b>Senkron</b> ile Google hesabınıza bağlanıp aynı defteri telefonunuzda ve bilgisayarınızda kullanırsınız; defter Drive\u2019ınızda yalnızca bu uygulamanın görebildiği gizli bir alanda durur, değişiklikleriniz kendiliğinden gider. İki cihazda farklı değişiklik olursa <b>Birleştirin</b> ikisini de tutar; Drive\u2019dan veri geldiğinde çıkan <b>geri alın</b> ile eski haline dönebilirsiniz. Gönderilmesi gereken bir değişiklik varsa Ayarlar simgesinde küçük bir mavi nokta belirir; Senkron bölümünden <b>Senkronize edin</b> demeniz yeterli.']
    ],

    about:'About',
    aboutIntro:'Yarın Defteri (Tomorrow\u2019s Notebook) came about to perceive and manage time and days better. If you know what scattered attention is like, you know that what is out of sight might as well not exist.\nThat is why, in Yarın Defteri, you can see one entry from within a day, a week, a month, and a year or several years. So you don\u2019t forget it. And because you can postpone it easily, it doesn\u2019t create stress.\nThe day, week, month, year and 10-year pages are connected views of the same work: you look at the same task at different scales and see today in a wider context of time. Not every task has to fit into a day; tasks you don\u2019t know when to do can wait in a suitable stretch of time (\u201cthis week\u201d, \u201cthis month\u201d, \u201cthis year\u201d) and move to a day when their time comes. That way you spread work across time instead of squeezing it into one day, and you postpone what you couldn\u2019t get to.\nDragging is the heart of it: hold a task and drop it on another time or on a view below to move it to that date, or drop it on the notebook icon to archive it. In the same way, you can drag notes in Timeless Notes onto tabs or the trash.\nFor notes that have no time attached there are post-its and Timeless Notes; ideas, things to remember and tasks you set aside wait there.',
    howTitle:'How to use',backExit:'Press back again to exit',advTitle:'Beta',selbarOn:'Format bar: on',selbarOff:'Format bar: off',liteGo:'Switch to Refined mode',liteOff:'Back to the normal mode',
    helpIntro:'Tomorrow\u2019s Notebook was made to fill the gaps a paper notebook leaves: write, tick things off, and leave what did not fit for tomorrow. The day, week, month, year and 10-year pages are connected, and on all of them you can plan like in a list and a calendar at once. An item with no date can be noted as \u201csometime this week\u201d or \u201cthis month\u201d; there are post-its for throwaway notes, Timeless Notes for ideas you want to keep.',
    helpTabs:['Notebook','Post-it','Timeless Notes'],
    helpPin:[
      ['What a post-it is','The post-it button at the top opens a throwaway space that is not tied to any day: a phone number, a shopping list, a sentence that just came to mind. It saves as you type. You can keep up to 10 post-its.'],
      ['Title and text','Each post-it has a small <b>Title</b> field at the top, filled in only if you like. What you write below is the note itself; <b>\u2610</b> adds lines with checkboxes. <b>+ New</b> opens another post-it. The trash icon sits at the right of the title. The <b>moon icon</b> at the top makes the post-it dark so it does not glare at night; when the app is in dark theme the post-it already opens dark, and the <b>sun icon</b> turns it yellow again.'],
      ['Moving between post-its','Post-its stack on top of each other. Swipe left or right, tap the edge of the next one, or tap the dots at the bottom. <b>Hold a dot</b> to see that post-it\u2019s title; inactive dots are faded.'],
      ['Move to a day or to Timeless Notes','The icons at the bottom move a post-it elsewhere. The <b>arrow with the sunny page</b> sends the whole post-it to today\u2019s page: the title becomes the task, what you wrote below becomes the task\u2019s note, and lines marked with \u2610 become the note\u2019s list items. If the title is empty, the first line becomes the task. The <b>arrow with the notebook</b> sends it to Timeless Notes; if you have several tabs you choose which one.'],
      ['Trash','The trash icon deletes a post-it, but it does not vanish at once: open the <b>Trash</b> view with the trash icon at the top. There <b>Put back</b> restores a post-it, the trash icon on its row removes it for good, and <b>Empty trash</b> clears everything (tap twice to be sure).']
    ],
    helpNb:[
      ['What Timeless Notes is','The notebook icon at the right of the bottom bar opens Timeless Notes. It is not a task area but a place to remember: like a journal or an idea book. It is tied to no day, nothing is counted, nothing has to get done.'],
      ['Writing a note','Type in the box at the top and press <b>Enter</b> to save (Shift+Enter for a new line). If you wrote something and did not save it, it stays in the box even when you tap elsewhere, until you save or delete it.'],
      ['Tabs','The <b>stacked-layers icon</b> shows every note together; <b>Other</b> shows notes that are not in a tab yet. <b>Archive</b>, with the clock icon, is where tasks you set aside wait. <b>+</b> makes your own tabs (up to 12); with a tab selected, small icons appear below the notes: the <b>pencil</b> renames, the <b>trash</b> deletes the tab; long-press a tab and drag it to reorder. When a tab is deleted its notes return to Other.'],
      ['Locked tab','With a tab selected, a <b>lock icon</b> appears below the notes; tap it to set a password. A tab you encrypt can be used like a diary: while locked only a lock shows, the note titles and the count are hidden, and its notes do not appear in <b>All notes</b>. It locks itself after 5 minutes without a touch, and the lock icon locks it yourself; the key icon changes the password, the open lock removes it. Notes also travel encrypted in sync and backups. A short password can be guessed, a long one is safer. If you forget it the notes cannot be recovered; there is no recovery code.'],
      ['Long notes','The triangle under a note shortens a long text to 4 lines or opens it: a <b>hollow triangle</b> means folded, a <b>filled triangle</b> means open. Notes longer than 10 lines start folded.'],
      ['Three dots, date and moving','A note’s tab and the date it was written stay hidden; <b>tap</b> its three-dot handle to show them under the note. <b>Drag</b> the handle onto one of the tabs above to move the note there, or onto the trash icon to delete it.'],
      ['Trash','Tap the trash icon at the right of the new-note box to open deleted notes. Drag a note onto a tab to put it back, use the trash icon next to a note to delete it forever, or <b>Empty trash</b> to clear all. The trash has no counter; this is a free space.'],
      ['Archive: tasks set aside','Hold a task and drop it on the notebook icon at the bottom, or tap the <b>clock icon</b> in its menu, and it goes to the <b>Archive</b> tab, waiting with its sub-items and note. Tap an archived line\u2019s text or its note icon to open and edit its note; nothing is locked. The same list opens from <b>Archive</b> in Settings. There is no counter. <b>Put back</b> returns it to today or any other page when you want.']
    ],
    
    tourNext:'Next',tourBack:'Back',tourSkip:'Skip',tourDone:'Done',tourAgain:'Show the tour again',tourMore:'Start the tour',liteMode:'Refined mode',tourOf:'{n} / {m}',
    tour:{
      day:[
        ['Welcome to Yarın Defteri','You can look at the same task from day, week, month, year and 10-year views. Postpone as much as you like, it won\u2019t slip out of sight and you won\u2019t forget. Postpone freely, you\u2019ll get to it one day. \nA short tour shows how it works, tap Next. You can reopen this tour any time from \u201cStart the tour\u201d in Settings and practise.'],
        ['Write','Tap a line and write. Enter opens a new line. \nBackspace on an empty line removes it.'],
        ['Done, drag, move','Tap the box: task done. Press and hold the box, then drag (on a computer, click and drag).\nDrop on the arrows next to the date {lr} to postpone by a day. Drop on the Week, Month or Year view below to move it there. Drop on the Timeless Notes {nb} icon at the far right to turn it into a note.'],
        ['Three dots','Tap the three dots {dots} to detail the line you wrote.\nAdd a note, give a date and time, set a repeat, attach a link or delete.\nOn lines with a note the icon changes: a {note} note icon appears instead of the three dots.'],
        ['Sometime this week','The + line on top is the Sometime this week section. Write here, or drag a line into it, and the task belongs to that week without a day. The Sometime this month section at the bottom does the same for the month.'],
        ['Move between days','Tap the arrows or swipe the main area left and right to move between days. Tap the date in the title to open a calendar.\nOn a keyboard, use \u2190 \u2192, and T returns to today.'],
        ['Weather','Tap the small cloud next to the date and pick your city. The day\u2019s temperature shows beside it; tapping it opens an hour-by-hour rain summary and a 10-day forecast.\nYou can turn it off in Settings.'],
        ['Views','Day, Week, Month, Year, 10 Yr: look at the same work at different scales. The {nb} icon at the far right is Timeless Notes.\nIt works like a timeless notebook.'],
        ['Sticky notes','For quick, short notes. Swipe the cards left and right to switch.\nA card can move to a task.'],
        ['Settings','Theme, language (TR / EN), text size, weather, backup and sync are here.\nYou can open this tour again any time from \u201cStart the tour\u201d in the About section.']
      ],
      week:[
        ['Week','The seven days of the week, one under another. Tap the arrows or swipe the main area to move between weeks.'],
        ['A day\u2019s lines','Tap a day\u2019s lines and write. Tap the date on the left to open that day. Past days fold up; tap the triangle to open or close them.'],
        ['Drag','Drag the box onto another day\u2019s lines. Drop on the arrows next to the title {lr} to move a week forward or back. Drop on the Month or Year view below to move it there.'],
        ['Sometime this week','Weekly tasks without a day sit at the top, monthly ones at the bottom. Drop a line there and it belongs to the week or month without a day.']
      ],
      month:[
        ['Month','Tap the arrows or swipe: move between months.'],
        ['Calendar','Each day is a box; days with tasks show a mark. Tap a day once: its tasks open below. Tap again to open the day page.'],
        ['Plan the day','The card below the calendar is the plan for the selected day: write here. Swipe it left and right to move between days, and tap Go to day to open the day\u2019s page.'],
        ['Move','Hold a task in the calendar and drag it to another day\u2019s box to move it there. Drop on the arrows next to the title {lr} to put it in the Sometime this month section of the next or previous month. Drop on the views below to send it to Year or 10 Yr.'],
        ['Sometime this month','The + line on top: monthly tasks without a day are here. Write here or drag daily tasks in.']
      ],
      year:[
        ['Year','Tap the arrows or swipe: move between years.'],
        ['Months','Each month has its own lines. Tap a month name to open that month; the triangle folds it. Past months are gathered in one row.'],
        ['Drag','Drag a task onto another month\u2019s lines to move it there. Drop on the arrows next to the title {lr} to put it in the Sometime this year section of the next or previous year.'],
        ['Sometime this year','The + line on top: yearly tasks without a month are here. Write there or drag tasks in.']
      ],
      decade:[
        ['10 Years','Tap the arrows or swipe: move between ten-year spans.'],
        ['Years','Ten years, one under another. Tap a year name to open that year. Write long-term goals on the year\u2019s lines.'],
        ['Drag','Drag a task onto another year\u2019s lines to move it there. Drop on the arrows next to the title {lr} to put it in the top section of the next or previous decade.']
      ],
      nb:[
        ['Tabs','Sort your notes into tabs. + opens a new tab, and you can drag tab names to reorder them. The first icon shows all notes together; Other shows notes that are not in a tab yet.'],
        ['Add a note','Write and press Enter: the note is added on top. The table icon next to it adds a table note; the bin icon shows deleted notes.'],
        ['Drag','Drag from the handle beside a note. Drop between two notes to reorder. Drop on a tab to move it there, or on the Bin to delete it. Tabs and the Bin appear at the bottom while you drag.'],
        ['Formatting','Links in notes are clickable. Write **bold** and ==highlight==; [word](address) links a word. Long notes fold with the triangle.']
      ],
      pins:[

function attachToProject(it,pj){
  if(!pj)return;
  var rc0=recOf(it);
  if(rc0&&(!rc0.n||rc0.todos.length||(rc0.arch&&rc0.arch.length)||(rc0.notes&&rc0.notes.trim()))){
    if(rc0.id===pj.id||descIds(rc0)[pj.id])return;
    it.up=pj.id;queueSave();render();
    toast(T.pjAdded+' \u00b7 '+(pj.title.trim()||T.pjUntitled));
    openSheet(it);return;
  }
  delete it.up;
  if(it.pt){
    if(it.pj===pj.id)return;
    var old=findProject(it.pj);
    if(old)old.todos=old.todos.filter(function(t){return t.id!==it.pt});
    delete it.pj;delete it.pt;
  }
  var chunks=[];
  var rc=recOf(it);
  if(rc&&rc.n){
    var ls=rc.todos.map(function(t){return (t.done?'\u2611 ':'\u2610 ')+t.text});
    if(rc.notes&&rc.notes.trim())ls.push(rc.notes);
    if(ls.length)chunks.push(ls.join('\n'));
    deleteProject(rc);delete it.pj;
  }
  if(it.note&&it.note.trim()){chunks.push(it.note);delete it.note}
  if(chunks.length)pj.notes=(pj.notes?pj.notes+'\n':'')+it.text+':\n'+chunks.join('\n');
  var t={id:uid(),text:it.text,done:!!it.done};
  if(it.layer==='day')t.due=it.key;
  pj.todos.push(t);it.pj=pj.id;it.pt=t.id;
  queueSave();render();
  toast(T.pjAdded+' \u00b7 '+(pj.title.trim()||T.pjUntitled));
  openSheet(it);
}
function detachFromProject(it){
  if(it.up&&!it.pt){delete it.up;queueSave();render();openSheet(it);return}
  var pj=findProject(it.pj);
  if(pj)pj.todos=pj.todos.filter(function(t){return t.id!==it.pt});
  delete it.pj;delete it.pt;
  queueSave();render();openSheet(it);
}

      callback:function(r){clearTimeout(to);

  btn.addEventListener('pointerdown',function(e){

/* postpone by arrow: shift an item by one step of the page it is dropped on (or its own, if coarser) */
var UORD={day:0,week:1,month:2,year:3,decade:4};
function addMonthsClamp(d,n){
  var y=d.getFullYear(),m=d.getMonth()+n,day=d.getDate();
  var ny=y+Math.floor(m/12),nm=((m%12)+12)%12,dim=new Date(ny,nm+1,0).getDate();
  return new Date(ny,nm,Math.min(day,dim));
}
function postponeKey(it,dir){
  var L=it.layer,unit=UORD[L]>=UORD[view]?L:view,base;
  if(L==='day'||L==='week')base=pd(it.key);
  else if(L==='month')base=pd(it.key+'-01');
  else base=new Date(+it.key,0,1);
  var nd;
  if(unit==='day')nd=addDays(base,dir);
  else if(unit==='week')nd=addDays(base,7*dir);
  else if(unit==='month')nd=addMonthsClamp(base,dir);
  else if(unit==='year')nd=addMonthsClamp(base,12*dir);
  else nd=addMonthsClamp(base,120*dir);

  var NL=(UORD[L]<UORD[view]&&UORD[view]>=2)?view:L;

function toPin(it){

/* ---------- gestures ---------- */
var pageEl=document.getElementById('page'),sx=null,sy=0,st=0,swAx=null,swVx=0,swLx=0,swLt=0;
pageEl.addEventListener('touchstart',function(e){
  if(e.touches.length!==1){sx=null;return}
  if(e.target.closest&&e.target.closest('.mcar')){sx=null;return}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
  swAx=null;swVx=0;swLx=sx;swLt=st;
},{passive:true});
var swOn=false;
function swEl(){return document.getElementById('pbody')}
function swReset(anim){
  swOn=false;var el=swEl();if(!el)return;
  el.style.transition=anim?'transform .18s ease-out,opacity .18s':'none';
  el.style.transform='';el.style.opacity='';
  if(anim)setTimeout(function(){el.style.transition=''},220);else el.style.transition='';
}
/* axis is decided once, early; a horizontal swipe then owns the gesture (no vertical drift, no bar jumping) */
pageEl.addEventListener('touchmove',function(e){
  if(sx==null||drag||view==='nb'||e.touches.length!==1)return;
  var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(!swAx){
    if(Math.max(Math.abs(dx),Math.abs(dy))<9)return;
    swAx=Math.abs(dx)>Math.abs(dy)*1.05?'x':'y';
  }
  if(swAx!=='x')return;
  var el=swEl();if(!el)return;
  if(e.cancelable)e.preventDefault();
  var now=Date.now();
  if(now>swLt){var v=(t.clientX-swLx)/(now-swLt);swVx=swVx*.4+v*.6;swLx=t.clientX;swLt=now}
  swOn=true;
  var off=Math.max(-56,Math.min(56,Math.round(dx*.6)));
  el.style.transition='none';
  el.style.transform='translateX('+off+'px)';
  el.style.opacity=String(1-Math.min(.35,Math.abs(off)/150));
},{passive:false});
pageEl.addEventListener('touchcancel',function(){sx=null;swAx=null;if(swOn)swReset(true)},{passive:true});
pageEl.addEventListener('touchend',function(e){
  var ax=swAx;swAx=null;
  if(sx==null||drag||Date.now()-lastDragEnd<500){sx=null;if(swOn)swReset(true);return}
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  var adx=Math.abs(dx),fast=Math.abs(swVx)>.45&&swVx*dx>0;
  if(ax==='x'&&adx>Math.abs(dy)*1.1&&(adx>=62||(fast&&adx>=26))){swReset(false);shift(dx<0?1:-1)}
  else if(swOn)swReset(true);
},{passive:true});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  var nowKey=dkey(today());
  if(nowKey!==lastToday){if(dkey(anchor)===lastToday)anchor=today();lastToday=nowKey;render()}
  if(SYNC_OK&&S.syncOn&&Date.now()-lastAuto>30000)syncNow(true,true);
  wxFetch(false);
});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fitAll();fitTitle()});
window.addEventListener('resize',function(){fitAll();fitTitle()});

if(!S.seeded){S.seeded=true;persist()}
(function(){try{var d=document.createElement('div');d.style.cssText='position:absolute;top:-999px;left:0;width:100px;height:100px;overflow:scroll;visibility:hidden';document.body.appendChild(d);var w=d.offsetWidth-d.clientWidth;d.remove();document.documentElement.style.setProperty('--sbw',Math.max(0,w)+'px')}catch(e){}})();
document.getElementById('gear').setAttribute('aria-label',T.settings);
document.getElementById('pinBtn').setAttribute('aria-label',T.pins);
buildTabs();render();
syncBtnUpdate();

if(SYNC_OK&&S.syncOn)setTimeout(function(){syncNow(true,true)},600);
})();

/* klavye açılınca pencereler görünür alanın içinde kalsın */
(function(){
  var vv=window.visualViewport,root=document.documentElement;
  if(!vv)return;
  function upd(){
    if(Math.abs(vv.scale-1)>.02){root.style.removeProperty('--vvh');root.style.removeProperty('--vvt');return}
    root.style.setProperty('--vvh',Math.round(vv.height)+'px');
    root.style.setProperty('--vvt',Math.round(vv.offsetTop)+'px');
    var a=document.activeElement;
    if(a&&sheet&&sheet.contains(a)&&/^(TEXTAREA|INPUT)$/.test(a.tagName))a.scrollIntoView({block:'nearest'});
  }
  vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd);
  sheet.addEventListener('focusin',function(e){
    var t=e.target;if(!/^(TEXTAREA|INPUT)$/.test(t.tagName))return;
    setTimeout(function(){upd();t.scrollIntoView({block:'nearest'})},120);
    setTimeout(function(){t.scrollIntoView({block:'nearest'})},400);
  });
  upd();
})();
</script>

<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
